<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>12 llaves para mi señorita ❤️</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;color:#fff;background:#261525}main{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(145deg,#43203e,#211321)}.card{width:min(100%,470px);min-height:75dvh;border:1px solid #ffffff45;border-radius:28px;padding:30px 24px;background:#ffffff12;box-shadow:0 12px 60px #0005;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:16px;backdrop-filter:blur(7px)}h1{font-size:clamp(27px,7vw,40px);margin:8px 0}p{line-height:1.6;font-size:18px}button,.btn{background:#f5d6bd;color:#46233c;border:0;border-radius:30px;padding:16px 22px;font-weight:bold;font-size:17px;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}textarea{width:100%;height:140px;border-radius:16px;padding:14px;font-size:17px;border:0;resize:vertical}label.option{display:block;text-align:left;background:#ffffff19;padding:14px;margin:9px 0;border-radius:14px;font-size:17px;cursor:pointer}input[type=radio]{margin-right:8px}.small{font-size:14px;opacity:.9}.bar{height:13px;border-radius:20px;background:#ffffff38;overflow:hidden}.fill{height:100%;background:#ffb3cb;transition:width .4s}.hidden{display:none!important}.cover{background-size:cover;background-position:center;position:relative}.cover:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#180e20ed 0%,#1e102580 45%,#1e102520 100%)}.cover .card{position:relative;background:transparent;border:0;box-shadow:none;justify-content:end;padding-bottom:10vh}.heart{font-size:32px;animation:pulse 2s infinite}@keyframes pulse{50%{transform:scale(1.2)}}.note{color:#ffdfeb;font-style:italic}.tools{position:fixed;top:8px;right:8px;z-index:10;font:13px sans-serif}.tools button{font:13px sans-serif;padding:9px}.upload{font-size:13px;display:block;margin:8px}.fade{animation:fade .8s ease}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}#dedication{white-space:pre-wrap;min-height:150px}
 
body{background:#e9bccb;color:#54283c}
main{background:linear-gradient(145deg,#f5dbe4,#e3adbf);position:relative;isolation:isolate;background-size:cover;background-position:center;transition:background-image .45s}
main::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(150deg,#f4dce6bb,#552b4488)}
.card{background:#fffaf0e8;color:#532a3d;min-height:unset;max-height:96dvh;overflow:auto;gap:13px;padding:22px 20px;border-color:#fff8f2}
h1{font-size:clamp(22px,5.5vw,30px);line-height:1.25}
p{font-size:17px}
button{background:linear-gradient(100deg,#d48ba6,#f1cfb0);color:#54283c}
label.option{background:#f3dbe4}
.small,.note{color:#66374d}
.bar{background:#dfbfcc}.fill{background:#c57d9b}
.cover .card{background:transparent;color:#fff;box-shadow:none}
.cover .small,.cover .note{color:#ffe9f1}
.cover:before{background:linear-gradient(0deg,#180e20dd,#1e102540)}
.petal-layer{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:5}
.petal{position:absolute;top:-10%;opacity:.5;font-size:18px;animation:petalfall linear infinite}
@keyframes petalfall{to{transform:translate(50px,115vh) rotate(270deg)}}
@media(prefers-reduced-motion:reduce){.petal{display:none}}
</style></head><body><div class="tools hidden"><button id="settingsBtn">⚙️ Foto y música</button><div id="settings" class="hidden" style="background:#29192f;padding:12px;border-radius:12px;max-width:230px"><label class="upload">Foto de portada <input id="photo" type="file" accept="image/*"></label><label class="upload">Audio autorizado <input id="audioFile" type="file" accept="audio/*"></label><button id="musicBtn">♫ Activar/pausar</button><p class="small">Los archivos elegidos funcionan en este dispositivo. Para publicarlos en GitHub, súbelos junto al HTML.</p></div></div><audio id="music" loop></audio><div class="petal-layer" id="petals" aria-hidden="true"></div><main id="main"><section class="card fade" id="card"></section></main><script>
const photos=['78b0ab4f04fae4f2cde0a68ff2560825_0.webp','Foto.jpg','IMG-20261024-WA0068.jpg','VID_20261103_122207_576.jpg','file_0000000046e4820ea63549accc9767d1.png'];
const phone='56954754253';
const questions=[
{q:'Mi señorita, ¿qué fue lo primero que pensó de mí cuando comenzamos a conocernos?',type:'text'},
{q:'Mi señorita, si tuviéramos una noche entera para nosotros dos, sin preocupaciones ni interrupciones, ¿qué le gustaría que hiciéramos primero?',opts:['Una cena romántica, abrazaditos.','Una noche de películas, regaloneo y muchos cariñitos.','Una noche de pasión, sin mirar el reloj.','Todas las anteriores, pero en el orden que yo quiera.']},
{q:'Mi señorita, si pudiera volver a vivir un solo momento de los que hemos compartido, ¿cuál elegiría y por qué?',type:'text'},
{q:'Elija un plan improvisado para hoy:',opts:['Caminar abrazados sin rumbo.','Cocinar algo rico juntos.','Escaparnos a ver el atardecer.','Quedarnos en casa con música y conversación.']},
{q:'¿Qué detalle mío le derrite aunque usted se haga la fuerte?',type:'text'},
{q:'Cuando piensa en nosotros, ¿qué imagen se le viene primero a la cabeza?',type:'text'},
{q:'Mi señorita, si estuviéramos completamente solos y yo le dijera que tenemos 15 minutos para hacer lo que usted quiera conmigo, ¿qué elegiría?',opts:['Besarme apasionadamente hasta perder la noción del tiempo.','Tomar la iniciativa y sorprenderme con su lado más atrevido.','Provocarme lentamente y dejarme con ganas de más.','Olvidarnos de los 15 minutos y dejar que pase lo que tenga que pasar.']},
{q:'¿Qué palabra usaría para describir cómo se siente cuando la abrazo?',type:'text'},
{q:'Dígame un deseo chiquitito que le gustaría que cumplamos pronto.',type:'text'},
{q:'Si hoy usted pudiera pedirme algo solo pa nosotros, sin filtros, ¿qué me pediría?',type:'text'},
{q:'¿Qué le hace sentir en paz cuando piensa en nosotros?',type:'text'},
{q:'Complete la frase: «Contigo quiero...»',type:'text'}
];
let index=-1,answers=[],photoURL='portada.png',hasOpenedWhatsApp=false;const main=document.getElementById('main'),card=document.getElementById('card'),music=document.getElementById('music');
function render(content,cover=false){main.className=cover?'cover':'';if(cover&&photoURL)main.style.backgroundImage=`url("${photoURL}")`;else main.style.backgroundImage='';card.className='card fade';card.innerHTML=content}
function start(){music.play().catch(()=>{});showQ(0)}
function showQ(n){index=n;let q=questions[n];render(`<div class="heart">❤️</div><div class="small">Llave ${n+1} de 12</div><div class="bar"><div class="fill" style="width:${(n/12)*100}%"></div></div><h1>${q.q}</h1>${q.opts?q.opts.map((a,i)=>`<label class="option"><input type="radio" name="answer" value="${i}">${'ABCD'[i]}. ${a}</label>`).join(''):'<textarea id="answer" placeholder="Escriba lo que le nazca del corazón..."></textarea>'}<button id="next">Continuar ❤️</button>`);main.style.backgroundImage=`url('${photos[n%6]}')`;document.getElementById('next').onclick=()=>{let v=q.opts?document.querySelector('input[name=answer]:checked')?.value:document.getElementById('answer').value.trim();if(v===undefined||v===null||v===''){alert('Primero responda, mi señorita ❤️');return}answers[n]=q.opts?q.opts[Number(v)]:v;if([2,5,8].includes(n))showNote(n);else next(n)}}
function next(n){n===11?finish():showQ(n+1)}
function showNote(n){let messages={2:'Vamos juntitos, mi señorita. ❤️',5:'Me encanta leerla. 💕',8:'Falta poquito, no se me arranque. 😏'};render(`<div class="heart">💕</div><h1>${messages[n]}</h1><button id="continue">Seguir jugando</button>`);document.getElementById('continue').onclick=()=>next(n)}
function finish(){render(`<div class="heart">💌</div><h1>¡Completó las 12 llaves!</h1><p>Antes de descubrir lo que viene, envíeme sus respuestas, mi señorita.</p><button id="send">Enviar mis respuestas a mi amor ❤️</button><p class="small">Se abrirá WhatsApp. Usted debe tocar «Enviar» allí y luego volver aquí.</p><button id="return" class="hidden">Ya envié mis respuestas ❤️</button>`);document.getElementById('send').onclick=()=>{const msg='❤️ Mis 12 respuestas para usted ❤️\n\n'+questions.map((q,i)=>`${i+1}. ${q.q}\n💗 ${answers[i]}`).join('\n\n');hasOpenedWhatsApp=true;document.getElementById('return').classList.remove('hidden');window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,'_blank')};document.getElementById('return').onclick=()=>{if(hasOpenedWhatsApp)reveal()}}
function reveal(){render(`<div class="heart">💖</div><h1>¡Felicidades, mi señorita!</h1><p>Ha ganado una <strong>salida romántica al cine para nosotros dos, con una película que elegiremos juntos.</strong> 🥹❤️</p><div id="dedication" class="note"></div><p>Con todo mi cariño. ❤️</p>`,!!photoURL);const words='Mi señorita, esta sorpresa es mi manera de decirle que la elijo hoy y mañana, que me hace bien y que quiero seguir cuidándola y sorprendiéndola. Gracias por dejarme estar en su vida. La acompaño hoy y siempre.'.split(' ');let i=0;const t=setInterval(()=>{const el=document.getElementById('dedication');if(!el||i>=words.length){clearInterval(t);return}el.textContent+=(i?' ':'')+words[i++]},170)}
function home(){index=-1;render(`<div class="heart">💗</div><h1>Mi señorita, usted tiene 12 llaves.</h1><p>Al final, una sorpresa nos espera juntos.</p><p class="note">Respire, sonría y piense en nosotros.</p><button id="start">Comenzar ❤️</button>`,true);document.getElementById('start').onclick=start}
document.getElementById('settingsBtn').onclick=()=>document.getElementById('settings').classList.toggle('hidden');
document.getElementById('photo').onchange=e=>{const f=e.target.files[0];if(f){if(photoURL)URL.revokeObjectURL(photoURL);photoURL=URL.createObjectURL(f);if(index===-1)home()}};
document.getElementById('audioFile').onchange=e=>{const f=e.target.files[0];if(f){music.src=URL.createObjectURL(f);music.volume=.28}};
document.getElementById('musicBtn').onclick=()=>music.paused?music.play().catch(()=>alert('Seleccione primero un audio autorizado.')):music.pause();
music.src='favorito.mp3';music.volume=.28;
const layer=document.getElementById('petals');
for(let i=0;i<12;i++){const e=document.createElement('span');e.className='petal';e.textContent='🌸';e.style.left=(i*37%98)+'%';e.style.animationDuration=(13+i%5*3)+'s';e.style.animationDelay=(-i*2.3)+'s';layer.appendChild(e)}
home();
</script></body></html>
